name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: space-invaders-jar
          path: target/space-invaders.jar
          if-no-files-found: ignore
